spring.application.name=diario

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diario?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# mantem os nomes das colunas exatamente como no modelo (ex.: idConta)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# JWT (segredo com no minimo 32 caracteres)
jwt.secret=${JWT_SECRET:troque-este-segredo-por-um-valor-bem-grande-e-aleatorio}
jwt.expiracao-minutos=${JWT_EXPIRACAO:120}

# CORS: endereços do front-end, separados por vírgula
cors.origins=${CORS_ORIGINS:http://localhost:4200}
