server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # rotas do Angular: qualquer caminho desconhecido volta para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # o env.js muda conforme o ambiente, então não deve ficar em cache
    location = /env.js {
        add_header Cache-Control "no-store";
    }
}
